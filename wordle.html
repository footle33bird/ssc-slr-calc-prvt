<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      [data-theme="dark"] {
        --bg: #0a0a0a;
        --surface: #111;
        --surface2: #181818;
        --border: rgba(255, 255, 255, 0.07);
        --border2: rgba(255, 255, 255, 0.14);
        --text: #f0ede8;
        --muted: rgba(240, 237, 232, 0.45);
        --accent: #c8a96e;
        --accent-dim: rgba(200, 169, 110, 0.12);
        --accent-border: rgba(200, 169, 110, 0.3);
        --accent-text: #0a0a0a;
        --danger: #e06060;
        --success: #6ec88a;
        --tile-empty: #181818;
        --tile-border: rgba(255, 255, 255, 0.16);
        --tile-filled-border: rgba(255, 255, 255, 0.36);
        --key-bg: #2a2a2a;
        --absent: #2a2724;
      }
      [data-theme="light"] {
        --bg: #f7f5f0;
        --surface: #fff;
        --surface2: #f0ede6;
        --border: rgba(0, 0, 0, 0.07);
        --border2: rgba(0, 0, 0, 0.14);
        --text: #1a1814;
        --muted: rgba(26, 24, 20, 0.45);
        --accent: #9e7a3f;
        --accent-dim: rgba(158, 122, 63, 0.1);
        --accent-border: rgba(158, 122, 63, 0.3);
        --accent-text: #fff;
        --danger: #c0392b;
        --success: #27704a;
        --tile-empty: #fff;
        --tile-border: rgba(0, 0, 0, 0.18);
        --tile-filled-border: rgba(0, 0, 0, 0.4);
        --key-bg: #d6d1c7;
        --absent: #b8b2a6;
      }

      /* state colours */
      :root {
        --correct: #6ec88a;
        --present: #b59a52;
      }

      html {
        font-size: 16px;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Mono", monospace;
        height: 100vh;
        overflow: hidden;
      }

      .page {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px;
        gap: 10px;
        height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
      }

      /* ── TITLE ── */
      .game-title {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 32px;
        font-weight: 300;
        font-style: italic;
        color: var(--accent);
        letter-spacing: -0.02em;
        line-height: 1;
      }

      /* ── BOARD ── */
      .board {
        display: grid;
        grid-template-rows: repeat(6, 1fr);
        gap: 6px;
        padding: 4px 0;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .tile {
        width: 54px;
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: 500;
        text-transform: uppercase;
        background: var(--tile-empty);
        border: 1px solid var(--tile-border);
        border-radius: 8px;
        color: var(--text);
        user-select: none;
        transition: border-color 0.12s ease, transform 0.08s ease;
      }
      .tile.filled {
        border-color: var(--tile-filled-border);
        animation: pop 0.12s ease;
      }
      @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.08); }
        100% { transform: scale(1); }
      }
      .tile.flip {
        animation: flip 0.5s ease forwards;
      }
      @keyframes flip {
        0% { transform: rotateX(0); }
        50% { transform: rotateX(90deg); }
        100% { transform: rotateX(0); }
      }
      .tile.correct {
        background: var(--correct);
        border-color: var(--correct);
        color: #0a0a0a;
      }
      .tile.present {
        background: var(--present);
        border-color: var(--present);
        color: #0a0a0a;
      }
      .tile.absent {
        background: var(--absent);
        border-color: var(--absent);
        color: var(--text);
      }
      .row.shake {
        animation: shake 0.4s ease;
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
      }

      /* ── MESSAGE ── */
      .msg {
        min-height: 18px;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        text-align: center;
        transition: opacity 0.2s;
      }

      /* ── KEYBOARD ── */
      .keyboard {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        max-width: 460px;
      }
      .kb-row {
        display: flex;
        gap: 5px;
        justify-content: center;
      }
      .key {
        flex: 1;
        min-width: 0;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--key-bg);
        border: 1px solid var(--border2);
        border-radius: 6px;
        color: var(--text);
        font-family: "DM Mono", monospace;
        font-size: 13px;
        font-weight: 500;
        text-transform: uppercase;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: all 0.12s;
      }
      .key:hover {
        border-color: var(--accent-border);
      }
      .key:active {
        transform: scale(0.93);
      }
      .key.wide {
        flex: 1.5;
        font-size: 9px;
        letter-spacing: 0.08em;
      }
      .key.correct {
        background: var(--correct);
        border-color: var(--correct);
        color: #0a0a0a;
      }
      .key.present {
        background: var(--present);
        border-color: var(--present);
        color: #0a0a0a;
      }
      .key.absent {
        background: var(--absent);
        border-color: var(--absent);
        color: var(--muted);
      }

      /* ── CONTROLS ── */
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 18px;
        border-radius: 6px;
        font-family: "DM Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        border: 1px solid;
        transition: all 0.18s;
      }
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
        font-weight: 500;
      }
      .btn-primary:hover {
        opacity: 0.85;
      }
      .btn-ghost {
        background: transparent;
        border-color: var(--border2);
        color: var(--muted);
      }
      .btn-ghost:hover {
        color: var(--text);
        border-color: var(--accent-border);
      }

      .note {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.07em;
        text-align: center;
        max-width: 460px;
      }

      @media (max-width: 480px) {
        .tile { width: 46px; height: 46px; font-size: 22px; }
        .key { height: 44px; }
      }
      @media (max-height: 680px) {
        .tile { width: 44px; height: 44px; font-size: 21px; }
        .key { height: 42px; }
      }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 100px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--accent-border); }
      * { scrollbar-width: thin; scrollbar-color: var(--border2) var(--bg); }
    </style>
  </head>

      /* ── STATE ── */
      const ROWS = 6, COLS = 5;
      let answer = "";
      let grid = [];      // letters
      let curRow = 0, curCol = 0;
      let gameOver = false;

      const boardEl = document.getElementById("board");
      const keyboardEl = document.getElementById("keyboard");
      const msgEl = document.getElementById("msg");

      /* ── BUILD BOARD ── */
      function buildBoard() {
        boardEl.innerHTML = "";
        for (let r = 0; r < ROWS; r++) {
          const row = document.createElement("div");
          row.className = "row";
          row.dataset.row = r;
          for (let c = 0; c < COLS; c++) {
            const t = document.createElement("div");
            t.className = "tile";
            row.appendChild(t);
          }
          boardEl.appendChild(row);
        }
      }

      /* ── BUILD KEYBOARD ── */
      const KB = ["qwertyuiop", "asdfghjkl", "↵zxcvbnm⌫"];
      function buildKeyboard() {
        keyboardEl.innerHTML = "";
        KB.forEach((line) => {
          const row = document.createElement("div");
          row.className = "kb-row";
          for (const ch of line) {
            const key = document.createElement("div");
            if (ch === "↵") {
              key.className = "key wide";
              key.textContent = "Enter";
              key.dataset.key = "Enter";
            } else if (ch === "⌫") {
              key.className = "key wide";
              key.textContent = "⌫";
              key.dataset.key = "Backspace";
            } else {
              key.className = "key";
              key.textContent = ch;
              key.dataset.key = ch;
            }
            key.addEventListener("click", () => handleKey(key.dataset.key));
            row.appendChild(key);
          }
          keyboardEl.appendChild(row);
        });
      }

      /* ── NEW WORD ── */

        answer = WORDS[Math.floor(Math.random() * WORDS.length)];
        grid = Array.from({ length: ROWS }, () => Array(COLS).fill(""));
        curRow = 0;
        curCol = 0;
        gameOver = false;
        buildBoard();
        buildKeyboard();
        showMsg("New word — good luck ✦");
        setTimeout(() => showMsg(""), 1600);
      }

      /* ── INPUT ── */
      function handleKey(key) {
        if (gameOver) return;
        if (key === "Enter") return submitGuess();
        if (key === "Backspace") {
          if (curCol > 0) {
            curCol--;
            grid[curRow][curCol] = "";
            paintTile(curRow, curCol, "", true);
          }
          return;
        }
        if (/^[a-z]$/i.test(key) && curCol < COLS) {
          grid[curRow][curCol] = key.toLowerCase();
          paintTile(curRow, curCol, key.toLowerCase(), false);
          curCol++;
        }
      }

      function paintTile(r, c, letter, cleared) {
        const tile = boardEl.children[r].children[c];
        tile.textContent = letter;
        tile.classList.toggle("filled", !cleared && !!letter);
      }

      /* ── SUBMIT + SCORING ── */
      function submitGuess() {
        if (curCol < COLS) {
          shakeRow();
          showMsg("Not enough letters");
          return;
        }
        const guess = grid[curRow].join("");
        if (!VALID.has(guess)) {
          shakeRow();
          showMsg("Not in word list — try another");
          // clear the row so the player can retype without backspacing
          clearRow();
          return;
        }

        const result = score(guess, answer);
        revealRow(curRow, guess, result);

        if (guess === answer) {
          gameOver = true;
          const praise = ["Genius", "Magnificent", "Impressive", "Splendid", "Great", "Phew"];
          setTimeout(() => showMsg(praise[curRow] || "Solved ✦"), COLS * 300 + 200);
          return;
        }
        curRow++;
        curCol = 0;
        if (curRow >= ROWS) {
          gameOver = true;
          setTimeout(
            () => showMsg("The word was " + answer.toUpperCase()),
            COLS * 300 + 200
          );
        }
      }

      // Wordle duplicate-aware scoring
      function score(guess, answer) {
        const res = Array(COLS).fill("absent");
        const counts = {};
        for (const ch of answer) counts[ch] = (counts[ch] || 0) + 1;
        // greens first
        for (let i = 0; i < COLS; i++) {
          if (guess[i] === answer[i]) {
            res[i] = "correct";
            counts[guess[i]]--;
          }
        }
        // then yellows
        for (let i = 0; i < COLS; i++) {
          if (res[i] === "correct") continue;
          if (counts[guess[i]] > 0) {
            res[i] = "present";
            counts[guess[i]]--;
          }
        }
        return res;
      }

      // wipe the current row's letters so the player can type a fresh guess
      function clearRow() {
        for (let c = 0; c < COLS; c++) {
          grid[curRow][c] = "";
          paintTile(curRow, c, "", true);
        }
        curCol = 0;
      }

      /* ── REVEAL ANIMATION ── */
      function revealRow(r, guess, result) {
        const rowEl = boardEl.children[r];
        for (let i = 0; i < COLS; i++) {
          const tile = rowEl.children[i];
          setTimeout(() => {
            tile.classList.add("flip");
            setTimeout(() => {
              tile.classList.remove("filled");
              tile.classList.add(result[i]);
              updateKey(guess[i], result[i]);
            }, 250);
          }, i * 300);
        }
      }

      const keyState = {}; // letter -> best state
      function updateKey(letter, state) {
        const rank = { absent: 0, present: 1, correct: 2 };
        if (!(letter in keyState) || rank[state] > rank[keyState[letter]]) {
          keyState[letter] = state;
        }
        const best = keyState[letter];
        document.querySelectorAll('.key').forEach((k) => {
          if (k.dataset.key === letter) {
            k.classList.remove("correct", "present", "absent");
            k.classList.add(best);
          }
        });
      }

      function shakeRow() {
        const rowEl = boardEl.children[curRow];
        rowEl.classList.add("shake");
        setTimeout(() => rowEl.classList.remove("shake"), 400);
      }

      function showMsg(m) {
        msgEl.textContent = m;
      }

      /* ── KEYBOARD EVENTS ── */
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); handleKey("Enter"); }
        else if (e.key === "Backspace") { e.preventDefault(); handleKey("Backspace"); }
        else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key);
      });

      /* ── THEME INHERIT FROM PARENT + BOOT ── */
      try {
        const t =
          window.parent.document.documentElement.getAttribute("data-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}

      newGame();
    </script>
  </body>
</html>
