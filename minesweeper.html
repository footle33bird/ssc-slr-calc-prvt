<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      [data-theme="dark"] {
        --bg: #0a0a0a;
        --surface: #111;
        --surface2: #181818;
        --border: rgba(255, 255, 255, 0.07);
        --border2: rgba(255, 255, 255, 0.14);
        --text: #f0ede8;
        --muted: rgba(240, 237, 232, 0.45);
        --accent: #c8a96e;
        --accent-dim: rgba(200, 169, 110, 0.12);
        --accent-border: rgba(200, 169, 110, 0.3);
        --accent-text: #0a0a0a;
        --danger: #e06060;
        --success: #6ec88a;
        --cell-hidden: #20201d;
        --cell-hidden-hi: #2a2925;
        --cell-open: #141413;
      }
      [data-theme="light"] {
        --bg: #f7f5f0;
        --surface: #fff;
        --surface2: #f0ede6;
        --border: rgba(0, 0, 0, 0.07);
        --border2: rgba(0, 0, 0, 0.14);
        --text: #1a1814;
        --muted: rgba(26, 24, 20, 0.45);
        --accent: #9e7a3f;
        --accent-dim: rgba(158, 122, 63, 0.1);
        --accent-border: rgba(158, 122, 63, 0.3);
        --accent-text: #fff;
        --danger: #c0392b;
        --success: #27704a;
        --cell-hidden: #e7e2d8;
        --cell-hidden-hi: #ded8cb;
        --cell-open: #faf8f3;
      }

      html { font-size: 16px; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Mono", monospace;
        height: 100vh;
        overflow: hidden;
      }

      .page {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px;
        gap: 10px;
        height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
      }

      .game-title {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 32px;
        font-weight: 300;
        font-style: italic;
        color: var(--accent);
        letter-spacing: -0.02em;
        line-height: 1;
      }

      /* ── DIFFICULTY ── */
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 6px;
        font-family: "DM Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        border: 1px solid;
        transition: all 0.18s;
        background: transparent;
        color: var(--muted);
        border-color: var(--border2);
        -webkit-tap-highlight-color: transparent;
      }
      .btn:hover {
        color: var(--text);
        border-color: var(--accent-border);
      }
      .btn.on {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
        font-weight: 500;
      }
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
        font-weight: 500;
      }
      .btn-primary:hover { opacity: 0.85; color: var(--accent-text); }

      /* ── HUD ── */
      .hud {
        display: flex;
        gap: 22px;
        align-items: center;
      }
      .hud-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      .hud-label {
        font-size: 8px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .hud-val {
        font-size: 18px;
        font-weight: 500;
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }
      #face {
        font-size: 22px;
        cursor: pointer;
        line-height: 1;
        user-select: none;
      }

      /* ── BOARD ── */
      .board-wrap {
        position: relative;
        max-width: 100%;
        overflow: auto;
      }
      .board {
        display: grid;
        gap: 3px;
        padding: 8px;
        background: var(--surface);
        border: 1px solid var(--accent-border);
        border-radius: 10px;
        box-shadow: 0 0 32px rgba(200, 169, 110, 0.06);
        touch-action: manipulation;
      }
      .cell {
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--cell-hidden);
        border: 1px solid var(--border2);
        border-radius: 5px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.1s;
      }
      .cell:hover { background: var(--cell-hidden-hi); }
      .cell.open {
        background: var(--cell-open);
        border-color: var(--border);
        cursor: default;
        animation: cellReveal 0.18s ease;
      }
      @keyframes cellReveal {
        0% { transform: scale(0.82); opacity: 0.35; }
        100% { transform: scale(1); opacity: 1; }
      }
      .cell.flag {
        animation: flagPop 0.18s cubic-bezier(0.25, 1, 0.5, 1);
      }
      @keyframes flagPop {
        0% { transform: scale(0.4); }
        70% { transform: scale(1.22); }
        100% { transform: scale(1); }
      }
      .cell.open:hover { background: var(--cell-open); }
      .cell.mine {
        background: var(--danger);
        border-color: var(--danger);
        color: #0a0a0a;
      }
      .cell.flag { color: var(--accent); }
      .cell.wrong { background: var(--cell-open); color: var(--danger); }

      /* number colours */
      .n1 { color: #5b9bd5; }
      .n2 { color: #6ec88a; }
      .n3 { color: #e06060; }
      .n4 { color: #b58cf0; }
      .n5 { color: #d39152; }
      .n6 { color: #4fc4c4; }
      .n7 { color: var(--text); }
      .n8 { color: var(--muted); }

      .msg {
        min-height: 18px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        text-align: center;
      }
      .note {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.07em;
        text-align: center;
        max-width: 440px;
      }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 100px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--accent-border); }
      ::-webkit-scrollbar-corner { background: var(--bg); }
      * { scrollbar-width: thin; scrollbar-color: var(--border2) var(--bg); }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="game-title">Minesweeper</div>

      <div class="controls" id="difficulty">
        <button class="btn on" data-diff="easy">Easy</button>
        <button class="btn" data-diff="medium">Medium</button>
        <button class="btn" data-diff="hard">Hard</button>
      </div>

      <div class="hud">
        <div class="hud-item">
          <span class="hud-label">Mines</span>
          <span class="hud-val" id="mineCount">10</span>
        </div>
        <div id="face" title="New game">🙂</div>
        <div class="hud-item">
          <span class="hud-label">Time</span>
          <span class="hud-val" id="timer">0</span>
        </div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board"></div>
      </div>

      <div class="msg" id="msg"></div>

      <div class="note">
        Left-click / tap to reveal · Right-click or long-press to flag 🚩
      </div>
    </div>

    <script>
      const DIFFS = {
        easy: { rows: 9, cols: 9, mines: 10 },
        medium: { rows: 16, cols: 16, mines: 40 },
        hard: { rows: 16, cols: 30, mines: 99 },
      };
      const GAP = 3, PAD = 8, MAX_CELL = 32, MIN_CELL = 12;

      // pick the largest cell size that lets the whole board fit without scrolling
      function calcCell(rows, cols) {
        const availW = document.documentElement.clientWidth - 28;
        // reserve room for title, difficulty, hud, message, note
        const availH = document.documentElement.clientHeight - 250;
        const cellW = (availW - PAD * 2 - (cols - 1) * GAP) / cols;
        const cellH = (availH - PAD * 2 - (rows - 1) * GAP) / rows;
        return Math.max(
          MIN_CELL,
          Math.min(MAX_CELL, Math.floor(Math.min(cellW, cellH)))
        );
      }

      const boardEl = document.getElementById("board");
      const mineCountEl = document.getElementById("mineCount");
      const timerEl = document.getElementById("timer");
      const faceEl = document.getElementById("face");
      const msgEl = document.getElementById("msg");

      let diff = "easy";
      let ROWS, COLS, MINES, CELL;
      let cells = [];        // {mine, adj, open, flag, el}
      let started = false;   // mines placed after first click
      let over = false;
      let revealedCount = 0;
      let flags = 0;
      let timer = 0, timerInt = null;

      function setDiff(d) {
        diff = d;
        document.querySelectorAll("#difficulty .btn").forEach((b) =>
          b.classList.toggle("on", b.dataset.diff === d)
        );
        newGame();
      }

      function newGame() {
        const cfg = DIFFS[diff];
        ROWS = cfg.rows; COLS = cfg.cols; MINES = cfg.mines;
        CELL = calcCell(ROWS, COLS);
        started = false;
        over = false;
        revealedCount = 0;
        flags = 0;
        clearInterval(timerInt);
        timerInt = null;
        timer = 0;
        timerEl.textContent = "0";
        mineCountEl.textContent = MINES;
        faceEl.textContent = "🙂";
        msgEl.textContent = "";

        cells = [];
        boardEl.innerHTML = "";
        boardEl.style.gridTemplateColumns = `repeat(${COLS}, ${CELL}px)`;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const el = document.createElement("div");
            el.className = "cell";
            el.style.width = CELL + "px";
            el.style.height = CELL + "px";
            el.style.fontSize = Math.round(CELL * 0.5) + "px";
            const cell = { mine: false, adj: 0, open: false, flag: false, el, r, c };
            bindCell(cell);
            cells.push(cell);
            boardEl.appendChild(el);
          }
        }
      }

      const idx = (r, c) => r * COLS + c;
      const inBounds = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS;

      function neighbors(r, c) {
        const out = [];
        for (let dr = -1; dr <= 1; dr++)
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            if (inBounds(r + dr, c + dc)) out.push(cells[idx(r + dr, c + dc)]);
          }
        return out;
      }

      // place mines avoiding the first-clicked cell + its neighbors
      function placeMines(safeR, safeC) {
        const banned = new Set([idx(safeR, safeC)]);
        neighbors(safeR, safeC).forEach((n) => banned.add(idx(n.r, n.c)));
        let placed = 0;
        while (placed < MINES) {
          const i = Math.floor(Math.random() * cells.length);
          if (banned.has(i) || cells[i].mine) continue;
          cells[i].mine = true;
          placed++;
        }
        cells.forEach((cell) => {
          if (cell.mine) return;
          cell.adj = neighbors(cell.r, cell.c).filter((n) => n.mine).length;
        });
        started = true;
        startTimer();
      }

      function startTimer() {
        timerInt = setInterval(() => {
          timer++;
          timerEl.textContent = timer;
        }, 1000);
      }

      function bindCell(cell) {
        cell.el.addEventListener("click", () => reveal(cell));
        cell.el.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          toggleFlag(cell);
        });
        // long-press to flag on touch
        let pressTimer = null;
        cell.el.addEventListener(
          "touchstart",
          () => {
            pressTimer = setTimeout(() => {
              toggleFlag(cell);
              pressTimer = null;
            }, 380);
          },
          { passive: true }
        );
        cell.el.addEventListener("touchend", (e) => {
          if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
          } else {
            e.preventDefault(); // long-press already flagged; suppress click
          }
        });
      }

      function toggleFlag(cell) {
        if (over || cell.open) return;
        if (!started) return; // can't flag before first reveal
        cell.flag = !cell.flag;
        cell.el.textContent = cell.flag ? "🚩" : "";
        cell.el.classList.toggle("flag", cell.flag);
        flags += cell.flag ? 1 : -1;
        mineCountEl.textContent = MINES - flags;
      }

      function reveal(cell) {
        if (over || cell.open || cell.flag) return;
        if (!started) placeMines(cell.r, cell.c);

        if (cell.mine) return loseGame(cell);

        floodOpen(cell);

        if (revealedCount === ROWS * COLS - MINES) winGame();
      }

      function floodOpen(start) {
        const stack = [start];
        while (stack.length) {
          const cell = stack.pop();
          if (cell.open || cell.flag) continue;
          cell.open = true;
          revealedCount++;
          cell.el.classList.add("open");
          if (cell.adj > 0) {
            cell.el.textContent = cell.adj;
            cell.el.classList.add("n" + cell.adj);
          } else {
            cell.el.textContent = "";
            // expand into neighbours
            neighbors(cell.r, cell.c).forEach((n) => {
              if (!n.open && !n.mine && !n.flag) stack.push(n);
            });
          }
        }
      }

      function loseGame(hit) {
        over = true;
        clearInterval(timerInt);
        faceEl.textContent = "😵";
        msgEl.textContent = "Boom — game over";
        cells.forEach((cell) => {
          if (cell.mine && !cell.flag) {
            cell.el.classList.add("open");
            cell.el.textContent = "💣";
          }
          if (cell.flag && !cell.mine) {
            cell.el.classList.add("wrong");
            cell.el.textContent = "✕";
          }
        });
        hit.el.classList.add("mine");
        hit.el.textContent = "💥";
      }

      function winGame() {
        over = true;
        clearInterval(timerInt);
        faceEl.textContent = "😎";
        msgEl.textContent = "Cleared in " + timer + "s ✦";
        cells.forEach((cell) => {
          if (cell.mine && !cell.flag) {
            cell.el.textContent = "🚩";
            cell.el.classList.add("flag");
          }
        });
        mineCountEl.textContent = 0;
      }

      // rescale existing board to fit when the window/modal resizes
      function rescale() {
        if (!cells.length) return;
        CELL = calcCell(ROWS, COLS);
        boardEl.style.gridTemplateColumns = `repeat(${COLS}, ${CELL}px)`;
        cells.forEach((cell) => {
          cell.el.style.width = CELL + "px";
          cell.el.style.height = CELL + "px";
          cell.el.style.fontSize = Math.round(CELL * 0.5) + "px";
        });
      }
      window.addEventListener("resize", rescale);

      /* ── EVENTS ── */
      document.getElementById("difficulty").addEventListener("click", (e) => {
        const btn = e.target.closest(".btn");
        if (btn) setDiff(btn.dataset.diff);
      });
      faceEl.addEventListener("click", newGame);

      /* ── THEME INHERIT + BOOT ── */
      try {
        const t =
          window.parent.document.documentElement.getAttribute("data-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}

      newGame();
    </script>
  </body>
</html>
